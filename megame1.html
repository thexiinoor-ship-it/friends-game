<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Whack-a-Bunny 🐰</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:'Baloo 2',system-ui,sans-serif;font-size:18px;line-height:1.4;color:#3b2a50;background:linear-gradient(180deg,#9be0ff,#e4ffc9) fixed;overflow-x:hidden;-webkit-user-select:none;user-select:none}
.screen{display:none;min-height:100vh;padding:24px 16px;text-align:center;align-items:center;justify-content:center;flex-direction:column}
.screen.on{display:flex;animation:in .4s}
@keyframes in{from{opacity:0;transform:translateY(16px)}}
.card{background:#fffffff2;border-radius:28px;padding:24px 20px;max-width:420px;width:100%;box-shadow:0 10px 30px #0002}
h1{font-family:Pacifico,cursive;font-weight:400;font-size:clamp(1.7rem,7vw,2.4rem);line-height:1.3;color:#ff5fa2;margin-bottom:10px}
h2{font-size:1.4rem;color:#ff5fa2;margin-bottom:4px}
.btn{font:inherit;font-weight:700;border:0;border-radius:999px;padding:12px 28px;margin:10px 6px 0;color:#fff;background:linear-gradient(135deg,#ff7eb6,#ff5fa2);box-shadow:0 5px 0 #c63a7c;cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #c63a7c}
#yes{position:relative;z-index:6}
#no{background:linear-gradient(135deg,#8f9bff,#6b74e0);box-shadow:0 5px 0 #3f46a8;z-index:5;transition:transform .25s,opacity .25s}
#no.gone{transform:scale(0);opacity:0;pointer-events:none}
#hud{display:flex;gap:18px;justify-content:center;font-weight:700;font-size:1.15rem;margin:6px 0 14px}
#field{position:relative;width:100%;max-width:360px}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.hole{aspect-ratio:1;border:0;border-radius:50%;background:radial-gradient(circle at 50% 75%,#7a4a30,#3d2314);box-shadow:inset 0 -8px 0 #0005,0 6px 0 #2a170c;font-size:clamp(2.2rem,13vw,3.6rem);line-height:1;cursor:pointer;touch-action:manipulation;overflow:hidden}
.hole.up{animation:pop .18s}
@keyframes pop{from{transform:translateY(35%) scale(.6)}}
.hole.hit{background:radial-gradient(circle,#b6ff9e,#3d2314)}
.hole.bad{background:radial-gradient(circle,#ff8a8a,#3d2314)}
#ov{position:absolute;inset:-8px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fffffff2;border-radius:28px;padding:16px;box-shadow:0 10px 30px #0003}
#ov.hide{display:none}
#legend{margin-top:18px;font-weight:700}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>

<section class="screen on" id="ask">
  <div class="card">
    <h1>Before we start…</h1>
    <p id="qs">Are you willing to choose the rest of your life with me? 💍<br><b>I dare you to choose No 😈</b></p>
    <div><button class="btn" id="yes">Yes 💖</button><button class="btn" id="no">No 😤</button></div>
  </div>
</section>

<section class="screen" id="game">
  <h1>Whack-a-Bunny 🐰</h1>
  <div id="hud"><span>⭐ <b id="sc">0</b></span><span>⏱️ <b id="tm">30</b></span><span>🏆 <b id="bs">0</b></span></div>
  <div id="field">
    <div id="grid"></div>
    <div id="ov">
      <h2 id="ot">Tap the bunnies as fast as you can!</h2>
      <p id="os">30 seconds. Watch out for the ghosts 👻</p>
      <button class="btn" id="play">Play ▶</button>
    </div>
  </div>
  <p id="legend">🐰 +1 &nbsp; 🍫 +3 &nbsp; 👻 −2</p>
</section>

<script>
const $ = id => document.getElementById(id);
const pick = a => a[Math.floor(Math.random() * a.length)];
const screens = [...document.querySelectorAll('.screen')];
const show = id => { screens.forEach(s => s.classList.toggle('on', s.id === id)); window.scrollTo(0, 0); };

/* ---------- the question ---------- */
const labels = ['No 😤', 'Nope! 😜', 'Still no 😈', 'Too slow 🏃'];
let nc = 0;
$('yes').onclick = () => show('game');
$('no').onclick = () => {
  const n = $('no');
  nc++;
  n.classList.add('gone');
  if (nc >= 4) {
    $('qs').textContent = 'Okay okay, you dared enough 😏 Come in…';
    $('yes').style.display = 'none';
    setTimeout(() => show('game'), 1400);
    return;
  }
  setTimeout(() => {
    n.textContent = labels[nc % labels.length];
    n.style.position = 'fixed';
    n.style.left = Math.max(8, Math.random() * (window.innerWidth - n.offsetWidth - 16)) + 'px';
    n.style.top = Math.max(8, Math.random() * (window.innerHeight - n.offsetHeight - 16)) + 'px';
    n.classList.remove('gone');
  }, 350);
};

/* ---------- Whack-a-Bunny ---------- */
const EM = { b: '🐰', c: '🍫', g: '👻' };
const PTS = { b: 1, c: 3, g: -2 };
let score = 0, left = 30, active = false, spawnT, clockT, best = 0;
try { best = +localStorage.getItem('whack-best') || 0; } catch (e) {}
$('bs').textContent = best;

const holes = [];
function hide(h) {
  clearTimeout(h._t);
  delete h.dataset.k;
  h.textContent = '';
  h.classList.remove('up');
}
function whack(h) {
  const k = h.dataset.k;
  if (!k || !active) return;
  score = Math.max(0, score + PTS[k]);
  $('sc').textContent = score;
  h.classList.add(k === 'g' ? 'bad' : 'hit');
  setTimeout(() => h.classList.remove('hit', 'bad'), 180);
  hide(h);
}
for (let i = 0; i < 9; i++) {
  const h = document.createElement('button');
  h.className = 'hole';
  h.setAttribute('aria-label', 'hole');
  h.onpointerdown = () => whack(h);
  $('grid').appendChild(h);
  holes.push(h);
}
function spawn() {
  const free = holes.filter(h => !h.dataset.k);
  if (!free.length) return;
  const h = pick(free), r = Math.random(), e = 30 - left;
  const k = r < .7 ? 'b' : r < .85 ? 'c' : 'g';
  h.dataset.k = k;
  h.textContent = EM[k];
  h.classList.remove('up');
  void h.offsetWidth;
  h.classList.add('up');
  h._t = setTimeout(() => hide(h), Math.max(520, 1000 - e * 16));
}
function loop() {
  if (!active) return;
  spawn();
  spawnT = setTimeout(loop, Math.max(320, 720 - (30 - left) * 14));
}
function start() {
  score = 0; left = 30; active = true;
  $('sc').textContent = 0;
  $('tm').textContent = 30;
  $('ov').classList.add('hide');
  clockT = setInterval(() => { $('tm').textContent = --left; if (left <= 0) end(); }, 1000);
  loop();
}
function end() {
  active = false;
  clearInterval(clockT);
  clearTimeout(spawnT);
  holes.forEach(h => hide(h));
  const nb = score > best;
  if (nb) {
    best = score;
    $('bs').textContent = best;
    try { localStorage.setItem('whack-best', best); } catch (e) {}
  }
  $('ot').textContent = nb ? 'New best! 🎉' : 'Time\'s up! ⏰';
  $('os').textContent = `You scored ${score}. Best: ${best}`;
  $('play').textContent = 'Play again ▶';
  $('ov').classList.remove('hide');
}
$('play').onclick = start;
</script>
</body>
</html>
